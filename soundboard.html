<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likʼwala Alphabet Soundboard</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover: #eff6ff;
      --card-active: #dbeafe;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 2.5rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .letter-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: var(--shadow);
      transition: all 0.15s ease-in-out;
    }

    .letter-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .letter-card:active, .letter-card.playing {
      background-color: var(--card-active);
      border-color: var(--accent);
      transform: scale(0.96);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }

    .symbol {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.35rem;
      color: var(--text-main);
    }

    .phonetic {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
        gap: 0.75rem;
      }
      .symbol {
        font-size: 1.6rem;
      }
      .phonetic {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Likʼwala Alphabet Soundboard</h1>
    <p class="subtitle">Click any letter to listen to its pronunciation.</p>
  </header>

  <main class="grid-container" id="soundboard"></main>

  <footer>
    <p>Likʼwala / Liq'uala Language Learning Resource</p>
  </footer>

  <script>
    // Alphabet definition with symbols, phonetic guides, and safe file names
    const alphabet = [
      { char: "a",  phonetic: "ah (father)",   file: "a" },
      { char: "b",  phonetic: "b (boy)",       file: "b" },
      { char: "c",  phonetic: "ts (cats)",     file: "c" },
      { char: "c̓",  phonetic: "ts' (popped)",  file: "c_ejective" },
      { char: "d",  phonetic: "d (dog)",       file: "d" },
      { char: "dᶻ", phonetic: "dz (adze)",     file: "dz" },
      { char: "e",  phonetic: "eh (bed)",      file: "e" },
      { char: "ə",  phonetic: "uh (sofa)",     file: "schwa" },
      { char: "g",  phonetic: "g (go)",        file: "g" },
      { char: "gʷ", phonetic: "gw (Gwen)",     file: "gw" },
      { char: "ǧ",  phonetic: "deep g",        file: "g_uvular" },
      { char: "ǧʷ", phonetic: "deep gw",       file: "gw_uvular" },
      { char: "h",  phonetic: "h (hat)",       file: "h" },
      { char: "i",  phonetic: "ee (see)",      file: "i" },
      { char: "k",  phonetic: "k (kite)",      file: "k" },
      { char: "k̓",  phonetic: "k' (popped)",   file: "k_ejective" },
      { char: "kʷ", phonetic: "kw (quit)",     file: "kw" },
      { char: "k̓ʷ", phonetic: "kw' (popped)",  file: "kw_ejective" },
      { char: "l",  phonetic: "l (look)",      file: "l" },
      { char: "l̓",  phonetic: "l' (glottal)",  file: "l_glottal" },
      { char: "ł",  phonetic: "lh (breath)",   file: "lh" },
      { char: "λ",  phonetic: "dl (bedlam)",   file: "dl" },
      { char: "ƛ",  phonetic: "tl (atlas)",    file: "tl" },
      { char: "ƛ̓",  phonetic: "tl' (popped)",  file: "tl_ejective" },
      { char: "m",  phonetic: "m (mother)",    file: "m" },
      { char: "m̓",  phonetic: "m' (glottal)",  file: "m_glottal" },
      { char: "n",  phonetic: "n (net)",       file: "n" },
      { char: "n̓",  phonetic: "n' (glottal)",  file: "n_glottal" },
      { char: "o",  phonetic: "oh (go)",       file: "o" },
      { char: "p",  phonetic: "p (pen)",       file: "p" },
      { char: "p̓",  phonetic: "p' (popped)",   file: "p_ejective" },
      { char: "q",  phonetic: "deep k",        file: "q" },
      { char: "qʷ", phonetic: "deep kw",       file: "qw" },
      { char: "q̓",  phonetic: "deep k'",       file: "q_ejective" },
      { char: "q̓ʷ", phonetic: "deep kw'",      file: "qw_ejective" },
      { char: "s",  phonetic: "s (sun)",       file: "s" },
      { char: "t",  phonetic: "t (top)",       file: "t" },
      { char: "t̓",  phonetic: "t' (popped)",   file: "t_ejective" },
      { char: "u",  phonetic: "oo (boot)",     file: "u" },
      { char: "w",  phonetic: "w (wet)",       file: "w" },
      { char: "w̓",  phonetic: "w' (glottal)",  file: "w_glottal" },
      { char: "x",  phonetic: "kh (loch)",     file: "x" },
      { char: "xʷ", phonetic: "khw (rounded)", file: "xw" },
      { char: "x̌",  phonetic: "deep kh",       file: "x_uvular" },
      { char: "x̌ʷ", phonetic: "deep khw",      file: "xw_uvular" },
      { char: "y",  phonetic: "y (yes)",       file: "y" },
      { char: "y̓",  phonetic: "y' (glottal)",  file: "y_glottal" },
      { char: "ʔ",  phonetic: "catch (uh-oh)", file: "glottal_stop" }
    ];

    let currentAudio = null;
    const soundboard = document.getElementById('soundboard');

    // Generate grid cards
    alphabet.forEach(item => {
      const card = document.createElement('button');
      card.className = 'letter-card';
      card.type = 'button';
      card.setAttribute('aria-label', `Play sound for letter ${item.char}`);

      card.innerHTML = `
        <span class="symbol">${item.char}</span>
        <span class="phonetic">${item.phonetic}</span>
      `;

      card.addEventListener('click', () => playSound(item.file, card));
      soundboard.appendChild(card);
    });

    function playSound(filename, element) {
      // Stop currently playing audio if any
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        document.querySelectorAll('.letter-card').forEach(el => el.classList.remove('playing'));
      }

      // Create and play audio from assets folder
      const audioPath = `assets/${filename}.mp3`;
      currentAudio = new Audio(audioPath);

      element.classList.add('playing');

      currentAudio.play().catch(err => {
        console.warn(`Could not play audio clip: assets/${filename}.mp3`, err);
      });

      currentAudio.onended = () => {
        element.classList.remove('playing');
      };
    }
  </script>
</body>
</html>
