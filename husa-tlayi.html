<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>husa ƛ̕ay̓i — Lik̓wala Bear Counting Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-0:#0f2019;
    --forest-1:#173226;
    --forest-2:#1f4232;
    --bark:#4a3223;
    --bark-light:#6b4a32;
    --cream:#f4ecd8;
    --cream-dim:#d8ccae;
    --mist:#8fb9b3;
    --ochre:#c98a2c;
    --berry:#a13f4c;
    --spirit:#eef1ea;
    --success:#4f9a63;
    --success-dark:#357048;
    --fail:#b23a3a;
    --radius:18px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #2a4d3a 0%, transparent 60%),
      linear-gradient(180deg, var(--forest-0) 0%, var(--forest-1) 55%, var(--forest-0) 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:760px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding:0 16px 32px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', system-ui, sans-serif;}

  /* decorative mountain skyline */
  #bg-deco{
    position:fixed; left:0; right:0; bottom:0; height:38vh; z-index:-1;
    pointer-events:none; opacity:.55;
  }
  #bg-deco svg{width:100%;height:100%;display:block;}

  /* ===== topbar ===== */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 6px; gap:10px;
  }
  #topbar.hidden{display:none;}
  #topbar button{
    background:var(--bark); color:var(--cream); border:none;
    padding:9px 14px; border-radius:999px; font-family:'Baloo 2';
    font-weight:600; font-size:.95rem; cursor:pointer;
    box-shadow: var(--shadow);
  }
  #topbar button:hover{background:var(--bark-light);}
  #topbar button:focus-visible{outline:3px solid var(--mist); outline-offset:2px;}
  #level-badge{
    font-family:'Baloo 2'; font-weight:700; font-size:1rem;
    background:rgba(255,255,255,.08); padding:8px 14px; border-radius:999px;
    letter-spacing:.02em;
  }
  #scoreboard{font-size:.9rem; color:var(--cream-dim); text-align:right; line-height:1.3;}
  #scoreboard b{color:var(--ochre); font-family:'Baloo 2';}

  /* ===== screens ===== */
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .35s ease both;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  #screen-start{padding-top:8vh; text-align:center;}
  .title{
    font-size:clamp(2.6rem, 9vw, 4.2rem);
    margin:0; font-weight:800; letter-spacing:.01em;
    color:var(--cream);
    text-shadow: 0 4px 0 var(--forest-0), 0 10px 24px rgba(0,0,0,.4);
  }
  .title .roll{color:var(--ochre); display:inline-block; animation:roll 2.4s ease-in-out infinite;}
  @keyframes roll{0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);}}
  .subtitle{
    color:var(--cream-dim); font-size:1.05rem; margin:.6em auto 2em;
    max-width:32em; line-height:1.5;
  }
  .subtitle strong{color:var(--mist); font-family:'Baloo 2'; font-weight:600;}

  .level-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    margin:0 auto; max-width:560px;
  }
  @media (max-width:480px){ .level-grid{grid-template-columns:1fr;} }
  .level-card{
    text-align:left; cursor:pointer; border:none; border-radius:var(--radius);
    padding:18px 18px 16px; color:var(--cream);
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px;
    transition:transform .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden;
  }
  .level-card:hover{transform:translateY(-3px);}
  .level-card:focus-visible{outline:3px solid var(--cream); outline-offset:3px;}
  .level-card .emoji{font-size:2rem; line-height:1;}
  .level-card .name{font-family:'Baloo 2'; font-weight:700; font-size:1.25rem;}
  .level-card .range{font-size:.85rem; color:rgba(255,255,255,.85);}
  .level-cub{background:linear-gradient(135deg,#6fa583,#3f6f52);}
  .level-blackbear{background:linear-gradient(135deg,#6b4a32,#3f2c1c);}
  .level-grizzly{background:linear-gradient(135deg,#b06a2e,#7a4419);}
  .level-spiritbear{background:linear-gradient(135deg,#dcd7c2,#a39d81); color:#2a2418;}
  .level-spiritbear .range{color:#4a4330;}

  .credit{
    margin-top:2.4em; font-size:.78rem; color:rgba(244,236,216,.55);
    max-width:38em; margin-left:auto; margin-right:auto; line-height:1.5;
  }
  .credit a{color:var(--mist);}
  .setup-note{
    margin-top:1.2em; font-size:.78rem; color:#e8c27a;
    background:rgba(201,138,44,.12); border:1px solid rgba(201,138,44,.35);
    padding:10px 14px; border-radius:12px; max-width:38em; margin-left:auto;margin-right:auto;
    line-height:1.5; text-align:left;
  }

  /* ===== game screen ===== */
  .bear-field{
    position:relative; width:100%; height:min(46vh,340px); min-height:220px;
    margin:14px 0 18px; border-radius:var(--radius); overflow:hidden;
    background:
      linear-gradient(180deg, #274a37 0%, #1c3527 55%, #12271c 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), var(--shadow);
  }
  .bear-field::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:22%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.35));
    pointer-events:none;
  }
  .bear{
    position:absolute; will-change:transform; user-select:none;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));
    animation:rollin .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .bear.spirit{filter:drop-shadow(0 4px 3px rgba(0,0,0,.4)) grayscale(1) brightness(1.75) contrast(.9);}
  @keyframes rollin{
    0%{transform:translateY(-140px) rotate(-40deg) scale(.6); opacity:0;}
    70%{opacity:1;}
    100%{transform:translateY(0) rotate(var(--rot,0deg)) scale(var(--scl,1)); opacity:1;}
  }

  .question-panel{
    background:rgba(255,255,255,.04); border-radius:var(--radius);
    padding:18px 18px 22px; box-shadow:var(--shadow);
  }
  .question{
    font-family:'Baloo 2'; font-weight:700; font-size:1.3rem; text-align:center;
    margin:0 0 16px;
  }
  .answers{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  @media (max-width:420px){ .answers{grid-template-columns:1fr;} }
  .answer-btn{
    font-family:'Noto Sans'; font-weight:700; font-size:1.15rem;
    background:var(--bark); color:var(--cream); border:2px solid rgba(255,255,255,.08);
    border-radius:14px; padding:16px 10px; cursor:pointer;
    transition:transform .1s ease, background .15s ease, border-color .15s ease;
    line-height:1.3; word-break:break-word;
  }
  .answer-btn:hover:not(:disabled){transform:translateY(-2px); background:var(--bark-light);}
  .answer-btn:focus-visible{outline:3px solid var(--mist); outline-offset:2px;}
  .answer-btn:disabled{cursor:default;}
  .answer-btn.correct{background:var(--success); border-color:var(--success-dark); animation:pop .3s ease;}
  .answer-btn.wrong{background:var(--fail); opacity:.6; animation:shake .35s ease;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .feedback{
    text-align:center; font-family:'Baloo 2'; font-weight:700; font-size:1.15rem;
    min-height:1.6em; margin:16px 0 4px;
  }
  .feedback.correct{color:var(--success);}
  .feedback.wrong{color:#e28a8a;}

  .btn-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .btn-next, .btn-hear{
    font-family:'Baloo 2'; font-weight:700; font-size:1rem; cursor:pointer;
    border:none; border-radius:999px; padding:12px 22px; box-shadow:var(--shadow);
  }
  .btn-next{background:var(--ochre); color:#2a1c08;}
  .btn-next:hover{background:#dd9c3d;}
  .btn-hear{background:transparent; color:var(--mist); border:2px solid var(--mist); box-shadow:none;}
  .btn-hear:hover{background:rgba(143,185,179,.12);}
  .hidden{display:none !important;}

  .placeholder-note{
    text-align:center; font-size:.75rem; color:rgba(244,236,216,.45); margin-top:14px;
  }

  @media (prefers-reduced-motion: reduce){
    .bear, .title .roll, .answer-btn.correct, .answer-btn.wrong{animation:none !important;}
  }
</style>
</head>
<body>

<div id="bg-deco" aria-hidden="true">
  <svg viewBox="0 0 800 300" preserveAspectRatio="none">
    <path d="M0,300 L0,190 L90,120 L160,190 L230,90 L300,190 L360,140 L430,190 L500,80 L580,190 L650,130 L720,190 L800,150 L800,300 Z" fill="#0c1a13"/>
    <path d="M0,300 L0,230 L70,190 L140,230 L210,170 L280,230 L350,200 L420,230 L500,160 L580,230 L660,190 L730,230 L800,210 L800,300 Z" fill="#0f2018"/>
  </svg>
</div>

<div id="app">

  <header id="topbar" class="hidden">
    <button id="btn-menu" type="button">← Menu</button>
    <div id="level-badge"></div>
    <div id="scoreboard">Score <b id="score">0</b> · Streak <b id="streak">0</b></div>
  </header>

  <main id="screen-start" class="screen active">
    <h1 class="title">hus<span class="roll">a</span> ƛ̕ay̓i</h1>
    <p class="subtitle">Count the bears, then choose the answer in <strong>hudᶻəm</strong> — the Lik̓wala (Liq̓wala) number words. Pick a level to begin.</p>

    <div class="level-grid">
      <button class="level-card level-cub" data-level="cub" type="button">
        <span class="emoji">🐻</span>
        <span class="name">Cub</span>
        <span class="range">1 – 5 bears</span>
      </button>
      <button class="level-card level-blackbear" data-level="blackbear" type="button">
        <span class="emoji">🐻</span>
        <span class="name">Black Bear</span>
        <span class="range">1 – 10 bears</span>
      </button>
    </div>

    <p class="credit">
      Lik̓wala (Liq̓wala) is an endangered Kwak̓wala dialect of the Laichkwiltach people.
      See more at
      <a href="https://www.likwalamas.com/copy-of-wigilux-da-nala-what-is-t-1" target="_blank" rel="noopener">likwalamas.com — hudᶻəm</a>.
    </p>
    <div id="setup-note" class="setup-note"></div>
  </main>

  <main id="screen-game" class="screen">
    <div class="bear-field" id="bear-field" aria-hidden="true"></div>

    <div class="question-panel">
      <p class="question">How many bears do you see?</p>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="btn-row">
        <button class="btn-hear hidden" id="btn-hear" type="button">🔊 Hear it again</button>
        <button class="btn-next hidden" id="btn-next" type="button">Next Round →</button>
      </div>
      <p class="placeholder-note" id="placeholder-note"></p>
    </div>
  </main>

</div>

<script>
(function(){
  "use strict";

  /* ================================================================
     Lik̓wala (Liq̓wala) number words, 1–10, as provided by the user.
     Add a spoken-word clip URL to "audio" for any number (mp3/ogg/wav)
     and it will play instead of the built-in chime when the player
     asks to "hear" the number. If a "word" is ever cleared to null,
     the game falls back to showing "(#n)" so it stays playable.
  ================================================================ */
  const LIKWALA_NUMBERS = {
    1:  { word: "n̓əm",         audio: null },
    2:  { word: "maʔł",        audio: null },
    3:  { word: "yudəxʷ",      audio: null },
    4:  { word: "mu",          audio: null },
    5:  { word: "sək̕a",        audio: null },
    6:  { word: "q̓əƛ̕a",        audio: null },
    7:  { word: "ʔəλəbu",      audio: null },
    8:  { word: "maʔłgʷən̓ał", audio: null },
    9:  { word: "n̓an̓əm̓a",     audio: null },
    10: { word: "l̕aʔstu",      audio: null }
  };

  // To add spoken-word audio for any number, set its "audio" field to a
  // clip URL, e.g.  1: { word: "n̓əm", audio: "sounds/1.mp3" }

  function wordFor(n){
    const entry = LIKWALA_NUMBERS[n];
    return (entry && entry.word) ? entry.word : `(#${n})`;
  }
  function isPlaceholder(n){
    const entry = LIKWALA_NUMBERS[n];
    return !(entry && entry.word);
  }

  /* ================================================================
     Levels
  ================================================================ */
  const LEVELS = {
    cub:        { label:"Cub",         min:1, max:5,  bearClass:"" },
    blackbear:  { label:"Black Bear",  min:1, max:10, bearClass:"" }
  };

  /* ================================================================
     Audio — gentle synthesized chimes (used whenever a real audio
     clip hasn't been supplied for a number). We deliberately do NOT
     use text-to-speech to "say" the Lik̓wala words, since a synthetic
     voice would almost certainly mispronounce them.
  ================================================================ */
  let audioCtx = null;
  function getCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainPeak){
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.18, ctx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.05);
  }
  function chimeCorrect(){
    tone(523.25, 0,    .22, "sine");
    tone(659.25, .09,  .22, "sine");
    tone(783.99, .18,  .30, "sine");
  }
  function chimeTryAgain(){
    tone(220, 0, .18, "sine", .12);
  }
  function playNumberSound(n){
    const entry = LIKWALA_NUMBERS[n];
    if (entry && entry.audio){
      try{
        const a = new Audio(entry.audio);
        a.play().catch(()=>chimeCorrect());
        return;
      }catch(e){ /* fall through to chime */ }
    }
    chimeCorrect();
  }

  /* ================================================================
     State
  ================================================================ */
  let state = {
    levelKey:null, level:null,
    target:0, choices:[], locked:false,
    score:0, streak:0
  };

  /* ================================================================
     DOM refs
  ================================================================ */
  const screenStart = document.getElementById("screen-start");
  const screenGame  = document.getElementById("screen-game");
  const topbar      = document.getElementById("topbar");
  const levelBadge  = document.getElementById("level-badge");
  const scoreEl     = document.getElementById("score");
  const streakEl    = document.getElementById("streak");
  const bearField   = document.getElementById("bear-field");
  const answersEl   = document.getElementById("answers");
  const feedbackEl  = document.getElementById("feedback");
  const btnNext     = document.getElementById("btn-next");
  const btnHear     = document.getElementById("btn-hear");
  const btnMenu     = document.getElementById("btn-menu");
  const setupNote   = document.getElementById("setup-note");
  const placeholderNote = document.getElementById("placeholder-note");

  // Let the player know, once, if vocabulary still needs to be added.
  (function checkVocab(){
    const total = Object.keys(LIKWALA_NUMBERS).length;
    const missing = Object.keys(LIKWALA_NUMBERS).filter(k => isPlaceholder(+k)).length;
    if (missing > 0){
      setupNote.textContent =
        `⚠️ Vocabulary not added yet: ${missing} of ${total} Lik̓wala number words are still placeholders ` +
        `(shown as "(#n)"). The game works fully — open the file and fill in LIKWALA_NUMBERS to add real words.`;
    }
  })();

  /* ================================================================
     Screen / menu handling
  ================================================================ */
  document.querySelectorAll(".level-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      startLevel(card.dataset.level);
    });
  });

  btnMenu.addEventListener("click", ()=>{
    screenGame.classList.remove("active");
    screenStart.classList.add("active");
    topbar.classList.add("hidden");
  });

  function startLevel(key){
    state.levelKey = key;
    state.level = LEVELS[key];
    state.score = 0;
    state.streak = 0;
    updateScoreboard();
    levelBadge.textContent = `${state.level.label} · 1–${state.level.max}`;
    screenStart.classList.remove("active");
    screenGame.classList.add("active");
    topbar.classList.remove("hidden");
    nextRound();
  }

  function updateScoreboard(){
    scoreEl.textContent = state.score;
    streakEl.textContent = state.streak;
  }

  /* ================================================================
     Round logic
  ================================================================ */
  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function pickChoices(target, min, max){
    const pool = new Set([target]);
    const spread = Math.max(3, Math.round((max-min)/4));
    let guard = 0;
    while (pool.size < 4 && pool.size < (max-min+1) && guard < 500){
      guard++;
      const jitter = randInt(-spread, spread) || 1;
      let candidate = target + jitter;
      candidate = Math.max(min, Math.min(max, candidate));
      pool.add(candidate);
    }
    // fill any remainder randomly if range was very small
    while (pool.size < Math.min(4, max-min+1)){
      pool.add(randInt(min, max));
    }
    return shuffle(Array.from(pool));
  }

  function shuffle(arr){
    for (let i = arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function nextRound(){
    const {min,max} = state.level;
    state.target = randInt(min, max);
    state.choices = pickChoices(state.target, min, max);
    state.locked = false;

    renderBears(state.target, state.level.bearClass);
    renderAnswers(state.choices);

    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    btnNext.classList.add("hidden");
    btnHear.classList.add("hidden");

    const anyPlaceholder = state.choices.some(isPlaceholder);
    placeholderNote.textContent = anyPlaceholder
      ? "Some answers above are placeholders — add real words in LIKWALA_NUMBERS."
      : "";
  }

  function renderBears(count, extraClass){
    bearField.innerHTML = "";
    const fieldW = bearField.clientWidth || 600;
    const fieldH = bearField.clientHeight || 300;
    // scale bear size down as count grows so they still (mostly) fit,
    // while still allowing the slight overlap the brief asks for
    let size;
    if (count <= 5) size = 62;
    else if (count <= 10) size = 50;
    else if (count <= 20) size = 38;
    else size = 26;

    for (let i=0;i<count;i++){
      const bear = document.createElement("span");
      bear.className = "bear" + (extraClass ? " "+extraClass : "");
      bear.textContent = "🐻";
      const left = Math.random()*(fieldW - size) ;
      const top  = Math.random()*(fieldH - size*1.1);
      const rot  = (Math.random()*30-15).toFixed(1);
      const scl  = (0.85 + Math.random()*0.3).toFixed(2);
      bear.style.left = left+"px";
      bear.style.top = top+"px";
      bear.style.fontSize = size+"px";
      bear.style.setProperty("--rot", rot+"deg");
      bear.style.setProperty("--scl", scl);
      bear.style.animationDelay = (Math.random()*0.4)+"s";
      bearField.appendChild(bear);
    }
  }

  function renderAnswers(choices){
    answersEl.innerHTML = "";
    choices.forEach(num=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "answer-btn";
      btn.textContent = wordFor(num);
      btn.dataset.num = num;
      btn.addEventListener("click", ()=>onAnswer(num, btn));
      answersEl.appendChild(btn);
    });
  }

  function onAnswer(num, btn){
    if (state.locked) return;
    if (num === state.target){
      state.locked = true;
      btn.classList.add("correct");
      feedbackEl.textContent = "✅ Correct!";
      feedbackEl.className = "feedback correct";
      state.score++;
      state.streak++;
      updateScoreboard();
      playNumberSound(state.target);
      disableAllAnswers();
      btnNext.classList.remove("hidden");
      btnHear.classList.remove("hidden");
    } else {
      btn.classList.add("wrong");
      btn.disabled = true;
      feedbackEl.textContent = "❌ Try Again";
      feedbackEl.className = "feedback wrong";
      state.streak = 0;
      updateScoreboard();
      chimeTryAgain();
    }
  }

  function disableAllAnswers(){
    answersEl.querySelectorAll(".answer-btn").forEach(b=>{
      b.disabled = true;
      if (+b.dataset.num === state.target) b.classList.add("correct");
    });
  }

  btnNext.addEventListener("click", nextRound);
  btnHear.addEventListener("click", ()=>playNumberSound(state.target));

})();
</script>
</body>
</html>
